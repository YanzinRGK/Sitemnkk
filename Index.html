 <!-- Integração com o Firestore (Firebase) para salvar as curtidas -->
 <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
   import { getFirestore, doc, onSnapshot, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

   const firebaseConfig = {
     apiKey: "AIzaSyBoqDvC_Hi4a7zDqvmQ9APz0gbPVKMxAPk",
     authDomain: "like-like-no-pf-do-site.firebaseapp.com",
     projectId: "like-like-no-pf-do-site",
     storageBucket: "like-like-no-pf-do-site.firebasestorage.app",
     messagingSenderId: "1008879322876",
     appId: "1:1008879322876:web:342c06a2d1c07886a2b979",
     measurementId: "G-T4PZ279BDP"
   };

   // Inicializa Firebase
   const app = initializeApp(firebaseConfig);
   const db = getFirestore(app);

   const likeBtn = document.getElementById('likeBtn');
   const likeIcon = document.getElementById('likeIcon');
   const likeText = document.getElementById('likeText');
   const likeCount = document.getElementById('likeCount');

   let hasLiked = localStorage.getItem('yanzin_has_liked_firebase') === 'true';

   if (hasLiked) {
     likeBtn.classList.add('liked');
     likeIcon.textContent = '♥';
     likeText.textContent = 'Curtido';
   }

   // Referência do documento na coleção 'likes'
   const likeRef = doc(db, "likes", "profile_likes");

   // Escuta o banco de dados em tempo real
   onSnapshot(likeRef, (docSnap) => {
     if (docSnap.exists()) {
       likeCount.textContent = docSnap.data().count || 0;
     } else {
       setDoc(likeRef, { count: 0 });
       likeCount.textContent = 0;
     }
   });

   // Função ao clicar em Curtir
   likeBtn.addEventListener('click', async () => {
     if (hasLiked) return;

     hasLiked = true;
     localStorage.setItem('yanzin_has_liked_firebase', 'true');

     likeBtn.classList.add('liked');
     likeIcon.textContent = '♥';
     likeText.textContent = 'Curtido';

     try {
       await updateDoc(likeRef, {
         count: increment(1)
       });
     } catch (e) {
       // Cria o documento caso ele não exista ainda no banco
       await setDoc(likeRef, { count: 1 }, { merge: true });
     }
   });
 </script>
